<!doctype html>
<!-- imui selftest fixture: minimal chat UI. Tabs on the same origin share messages through a
     BroadcastChannel. Receive-side faults come from the query string:
       ?delay=MS   render incoming messages after MS
       ?drop=N     never render every Nth incoming message
       ?dup=N      render every Nth incoming message twice
       ?swap=1     hold one incoming message and render it after the next one (reorder)
       ?quote=1    an auto-reply bot answers every incoming message with "收到：<text>" -->
<html><head><meta charset="utf-8"><title>fake chat</title>
<style>body{font:14px sans-serif;margin:0;display:flex;height:100vh}
#list{width:200px;border-right:1px solid #ccc;padding:8px}#chat{flex:1;display:none;flex-direction:column}
#msgs{flex:1;overflow:auto;padding:8px}.b{margin:4px 0;padding:6px;background:#eef;border-radius:6px}
textarea{height:48px;margin:8px}</style></head>
<body>
<div id="list"><div class="row" id="room">Room A</div></div>
<div id="chat"><div id="msgs"></div><textarea placeholder="message"></textarea></div>
<script>
const q = new URLSearchParams(location.search);
const delay = +q.get('delay') || 0, drop = +q.get('drop') || 0, dup = +q.get('dup') || 0, swap = q.get('swap') === '1', quote = q.get('quote') === '1';
const ch = new BroadcastChannel('fake-chat');
const msgs = document.getElementById('msgs');
let n = 0, held = null;
const render = (t) => { const d = document.createElement('div'); d.className = 'b'; d.textContent = t; msgs.appendChild(d); };
document.getElementById('room').onclick = () => (document.getElementById('chat').style.display = 'flex');
const ta = document.querySelector('textarea');
ta.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const t = ta.value.trim(); ta.value = '';
  if (!t) return;
  setTimeout(() => render(t), 30);          // own echo
  setTimeout(() => ch.postMessage(t), 50);  // "server"
});
ch.onmessage = (e) => {
  n++;
  if (drop && n % drop === 0) return;
  const show = (t) => { render(t); if (dup && n % dup === 0) render(t); if (quote) setTimeout(() => render('收到：' + t), 100); };
  setTimeout(() => {
    if (swap && !held) { held = e.data; return; }
    show(e.data);
    if (held) { const h = held; held = null; show(h); }
  }, delay);
};
</script>
</body></html>
