# W3-5 E2: platform + memory service (+ the unit tests, one-off). Devices stay on the host (see Dockerfile).
#   pnpm start --docker      = docker compose up -d --build platform memory-core   (writes the memory config first)
#   pnpm stop --docker       = docker compose down    (SIGTERM: task processes stopped, this session's runs removed)
#   docker compose run --rm test                       (typecheck + unit tests in Linux, V20)
#   docker compose --profile bench up -d --build bench (W3-6 E4: AndroidWorld service; the bench emulator on the host)
#   docker compose --profile bench run --rm bench-run  (pilot set, 10 tasks; report into ./saved/bench)
#   docker compose --profile emulator up -d            (W3-6 E3: Teamily emulator in a container; needs /dev/kvm =
#                                                       a Linux host; config only until V21)
# Every `up` is a fresh platform: midscene_run/ is not a volume; platform/state keeps only what platform/session.ts
# keeps (accounts, full access, audit, skill cache); 「另存为」 archives live in ./saved on the host.
name: multi-test-agent

x-app: &app
  build: .
  image: multi-test-agent:local
  env_file:
    - path: .env
      required: false
  environment:
    # K9: the host's adb server (Docker Desktop: host.docker.internal reaches the host's loopback). The client in
    # the image is the host's adb version (37.0.1).
    ADB_SERVER_SOCKET: tcp:host.docker.internal:5037
    MEMORY_CORE_URL: http://memory-core:8420
    AUTOTEST_EMULATOR_RESTORE: "1"
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  platform:
    <<: *app
    ports:
      - "3210:3210"
    environment:
      ADB_SERVER_SOCKET: tcp:host.docker.internal:5037
      MEMORY_CORE_URL: http://memory-core:8420
      AUTOTEST_EMULATOR_RESTORE: "1"
      AUTOTEST_END_SESSION_ON_STOP: "1"
    stop_grace_period: 90s
    volumes:
      # private config, read-only
      - ./platform/accounts.local.yaml:/app/platform/accounts.local.yaml:ro
      - ./platform/conversations.local.yaml:/app/platform/conversations.local.yaml:ro
      - ./platform/devices.yaml:/app/platform/devices.yaml:ro
      - ./apk:/app/apk:ro
      # kept across sessions
      - state:/app/platform/state
      - ./saved:/app/saved
      - ./platform/explore:/app/platform/explore
      - ./platform/memory:/app/platform/memory
      - ./skills/teamily/pages.local.json:/app/skills/teamily/pages.local.json
      # memory service: the v3 key and our team / agent ids (scripts/memory-config.ts --init)
      - ./.docker/memory-core:/app/.docker/memory-core:ro
    depends_on:
      - memory-core

  memory-core:
    image: ${MEMORY_CORE_IMAGE:-agentmemory/memory-core:latest}
    ports:
      - "127.0.0.1:8420:8420"
    environment:
      TDAI_GATEWAY_PORT: "8420"
      TDAI_GATEWAY_HOST: 0.0.0.0
      TDAI_GATEWAY_API_KEY: ${MEMORY_CORE_API_KEY:-}
      TDAI_DATA_DIR: /data/tdai-memory
      STORE_MODE: sqlite
    volumes:
      - memory:/data/tdai-memory
      # generated from .env by scripts/memory-config.ts (holds the extraction model's key: not in git)
      - ./.docker/memory-core/tdai-gateway.yaml:/data/config/tdai-gateway.yaml:ro

  test:
    <<: *app
    profiles: ["test"]
    command: ["sh", "-c", "pnpm typecheck && pnpm test:unit"]
    environment:
      MEMORY_OFF: "1"
      AUTOTEST_EMULATOR_RESTORE: "0"

  # ---- W3-6 E4: AndroidWorld bench service. AndroidWorldAvd (emulator-5554, `-grpc 8554`) runs on the host and
  # is for the bench only; the service reaches it through the host's adb server and gRPC port (entrypoint.sh).
  bench:
    profiles: ["bench"]
    build:
      context: ./bench/androidworld
      additional_contexts:
        aw: ./ref/android_world
    image: multi-test-agent-bench:local
    command: ["--seed", "42", "--combos", "1"]
    environment:
      AW_HOST_GATEWAY: host.docker.internal
      AW_A11Y_PORT: "5056"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5055:5055"
      # the accessibility forwarder in the emulator dials 10.0.2.2:<port> = the host's loopback → here; a rebuilt
      # a11y wrapper takes the next port of the range (bench/androidworld/server.py)
      - "127.0.0.1:5056-5065:5056-5065"

  # One-off: the exploration executor runs the pilot set against the service. Reports go straight to ./saved/bench
  # (the bench's 「另存为」: kept across sessions, unlike midscene_run/).
  bench-run:
    <<: *app
    profiles: ["bench"]
    command: ["npx", "tsx", "bin/autotest.ts", "bench", "aw", "--pilot", "--udid", "emulator-5554", "--server", "http://bench:5055"]
    environment:
      ADB_SERVER_SOCKET: tcp:host.docker.internal:5037
      MEMORY_OFF: "1"
      AUTOTEST_EMULATOR_RESTORE: "0"
    volumes:
      - ./platform/devices.yaml:/app/platform/devices.yaml:ro
      - ./saved/bench:/app/midscene_run/bench
    depends_on:
      - bench

  # ---- W3-6 E3: the Teamily emulator in a container (open-source docker-android image; needs KVM, so a Linux
  # host — Docker Desktop on Windows has none). Same spec as W3-4 E1: 1080×2400, API 34. The platform then talks
  # to it over the compose network (`adb connect emulator:5555`), with its own adb server: no host forwarding
  # (the V17 question does not arise). Acceptance: V21 on a Linux host.
  emulator:
    profiles: ["emulator"]
    image: ${EMULATOR_IMAGE:-budtmo/docker-android:emulator_14.0}
    devices:
      - /dev/kvm
    environment:
      EMULATOR_DEVICE: ${EMULATOR_DEVICE:-Samsung Galaxy S10}
      EMULATOR_ADDITIONAL_ARGS: "-skin 1080x2400 -memory 4096 -cores 4"
      WEB_VNC: "true"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      # the APKs the user supplies (W3-4 E1) and the AVD with its snapshots (teamily-ready survives restarts)
      - ./apk:/apk:ro
      - avd:/home/androidusr

  platform-emu:
    <<: *app
    profiles: ["emulator"]
    ports:
      - "3210:3210"
    # the container's own adb server, connected to the emulator container (no host adb in this setup)
    command: ["sh", "-c", "adb start-server && until adb connect emulator:5555 | grep -q connected; do sleep 5; done && pnpm platform"]
    environment:
      ADB_SERVER_SOCKET: tcp:localhost:5037
      MEMORY_CORE_URL: http://memory-core:8420
      AUTOTEST_EMULATOR_RESTORE: "0"
      AUTOTEST_END_SESSION_ON_STOP: "1"
      # devices.emulator.yaml declares `emulator:5555` (same entry as emulator-5556 in devices.yaml, serial changed)
      PLATFORM_DEVICES_FILE: platform/devices.emulator.yaml
    stop_grace_period: 90s
    volumes:
      - ./platform/accounts.local.yaml:/app/platform/accounts.local.yaml:ro
      - ./platform/conversations.local.yaml:/app/platform/conversations.local.yaml:ro
      - ./platform/devices.emulator.yaml:/app/platform/devices.emulator.yaml:ro
      - ./apk:/app/apk:ro
      - state:/app/platform/state
      - ./saved:/app/saved
      - ./platform/explore:/app/platform/explore
      - ./platform/memory:/app/platform/memory
      - ./.docker/memory-core:/app/.docker/memory-core:ro
    depends_on:
      - emulator
      - memory-core

volumes:
  state:
  memory:
  avd:
