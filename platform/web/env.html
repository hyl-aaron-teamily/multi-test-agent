<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>环境</title><script src="/web.js"></script></head>
<body>
<div id="top"></div>
<div id="main">加载中…</div>
<script>
async function load() {
  await header('env');
  const r = await api('GET', `/envs/${enc(qs('id'))}`);
  if (!r.data) return (document.getElementById('main').innerHTML = `<p class="bad">${esc(r.summary)}</p>`);
  const e = r.data;
  const bad = e.state === 'unfit' || e.state === 'quarantined';
  document.getElementById('main').innerHTML = `
  <h1>环境 ${esc(e.id)}</h1>
  <div class="box">状态：<b class="${bad ? 'bad' : e.state === 'ready' ? 'ok' : ''}">${esc(e.stateText)}</b>（自 ${esc(e.since)}）${e.reason ? `<br>原因：${terms(e.reason)}` : ''}${e.suggestion ? `<br><b>下一步：</b>${esc(e.suggestion)}` : ''}
  ${e.state === 'unfit' && /锁屏/.test(e.reason ?? '') ? '<p class="bad"><b>手机已锁屏：请在手机上输入 PIN 解锁，然后点「重新检查」。</b></p>' : ''}
  ${e.state === 'quarantined' ? `<p class="bad"><b>${term('隔离')}：恢复没能让环境回到基线，已停止接新任务。</b></p>` : ''}</div>
  <p><button onclick="act('check')">${e.state === 'quarantined' ? '我已处理，重新检查' : '重新检查'}</button><button onclick="act('recover')">恢复</button><button onclick="act('offline')">下线</button> <span id="msg"></span></p>
  <h2>基线（干净的定义）${e.baseline ? `<span class="muted"> — ${esc(e.baseline.at)}</span>` : ''}</h2>
  <table><tr><th>项</th><th>结果</th><th>说明</th></tr>${(e.baseline?.items ?? []).map((i) => `<tr><td>${esc(i.id)}</td><td class="${i.ok ? 'ok' : 'bad'}">${i.ok ? '通过' : '未通过'}</td><td>${esc(i.detail)}</td></tr>`).join('') || '<tr><td colspan=3 class="muted">还没检查过</td></tr>'}</table>
  <h2>租约</h2><p>${e.lease ? `任务 <a href="/task.html?id=${enc(e.lease.taskId)}">${esc(e.lease.taskId)}</a>（pid ${esc(e.lease.pid ?? '-')}，自 ${esc(e.lease.at)}）` : '无'}</p>
  <h2>脏标记</h2><p>${e.dirty ? `<span class="bad">${esc(e.dirty.reason)}</span>（${esc(e.dirty.at)}）` : '无'}</p>
  <h2>环境配置项（为可测而做的系统改动）</h2>
  <table><tr><th>改什么</th><th>为什么</th><th>怎么还原</th><th>同意</th></tr>${e.configItems.map((c) => `<tr><td>${esc(c.what)}</td><td>${esc(c.why)}</td><td>${esc(c.restore)}</td><td>${c.consented ? `<span class="ok">已同意</span>（${esc(c.by)}）` : `<button onclick="consent('${esc(c.id)}')">同意</button>`}</td></tr>`).join('') || '<tr><td colspan=4 class="muted">无</td></tr>'}</table>
  <p class="muted">设备 ${esc(e.device)} · 账号 ${esc(e.account ?? '-')} · App ${esc(e.appVersion ?? '-')}</p>`;
}
async function act(a) {
  if (a === 'offline' && !confirm('下线：正在运行的任务会在步骤边界停止（≤ 60 秒），然后恢复环境。确定？')) return;
  document.getElementById('msg').textContent = '执行中…';
  const r = await api('POST', `/envs/${enc(qs('id'))}/${a}`);
  document.getElementById('msg').textContent = `${r.code}：${r.summary}`;
  load();
}
async function consent(item) {
  const r = await api('POST', `/envs/${enc(qs('id'))}/consent`, { item });
  alert(r.summary);
  load();
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
