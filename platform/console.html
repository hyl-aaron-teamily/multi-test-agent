<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>multi-test-agent 控制台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --bg:#f6f8fa; --accent:#0969da; --ok:#1a7f37; --bad:#cf222e; --warn:#9a6700; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:12px 20px; background:#fff; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; }
  header span { color:var(--muted); }
  main { display:grid; grid-template-columns: 380px 1fr; gap:16px; padding:16px 20px; }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  h2 { font-size:14px; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  textarea { min-height:84px; resize:vertical; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  button { padding:7px 14px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; margin-top:12px; width:100%; }
  .pill { display:inline-block; padding:0 8px; border-radius:10px; font-size:12px; border:1px solid currentColor; }
  .idle,.completed { color:var(--ok); } .busy,.running,.queued { color:var(--warn); } .offline,.failed,.cancelled { color:var(--bad); }
  .examples button { font-size:12px; padding:3px 8px; margin:4px 4px 0 0; }
  .muted { color:var(--muted); font-size:12px; }
  #report { white-space:normal; max-height:70vh; overflow:auto; }
  #report img { max-width:240px; border:1px solid var(--line); border-radius:6px; }
  #report pre { background:var(--bg); padding:8px; overflow:auto; font-size:12px; }
  #report table { font-size:12px; }
  .hidden { display:none; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<header><h1>multi-test-agent</h1><span>自然语言测试任务 · 设备池 · 报告</span></header>
<main>
  <div>
    <section>
      <h2>设备</h2>
      <table><thead><tr><th>设备</th><th>状态</th><th>任务</th></tr></thead><tbody id="devices"></tbody></table>
      <div class="muted" id="poolInfo"></div>
    </section>
    <section style="margin-top:16px">
      <h2>新建任务</h2>
      <label>类型</label>
      <select id="type"><option value="mission">自然语言任务（AI 生成计划并执行）</option><option value="explore">AI 探索</option><option value="monkey">Monkey 压测</option></select>
      <label>包名</label>
      <input id="package" value="ai.teamily.mobile">
      <div id="missionFields">
        <label>需求描述</label>
        <textarea id="request" placeholder="例如：聊天时偶发闪退，你试试能不能重现"></textarea>
        <div class="examples">
          <button data-ex="排查下消息列表的问题">消息列表</button>
          <button data-ex="左侧栏新加了个功能，看看使用流畅度和功能完整性">左侧栏新功能</button>
          <button data-ex="聊天时偶发闪退，你试试能不能重现">聊天闪退</button>
        </div>
        <div class="row">
          <div><label>步数上限</label><input id="maxSteps" type="number" min="1" placeholder="由计划决定"></div>
          <div><label>时长上限（分钟）</label><input id="maxMinutes" type="number" min="1" placeholder="由计划决定"></div>
        </div>
      </div>
      <div id="monkeyFields" class="hidden row">
        <div><label>seed</label><input id="seed" type="number" placeholder="随机"></div>
        <div><label>事件数</label><input id="events" type="number" placeholder="5000"></div>
      </div>
      <div id="exploreFields" class="hidden"><label>步数</label><input id="steps" type="number" placeholder="50"></div>
      <label>设备</label>
      <select id="device"><option value="">自动分配</option></select>
      <button class="primary" id="run">执行</button>
      <div class="err" id="formErr"></div>
    </section>
  </div>
  <div>
    <section>
      <h2>最近任务</h2>
      <table><thead><tr><th>任务</th><th>状态</th><th>设备</th><th>开始</th><th>结论</th><th></th></tr></thead><tbody id="tasks"></tbody></table>
    </section>
    <section style="margin-top:16px" id="detail" class="hidden">
      <h2 id="detailTitle"></h2>
      <div class="row" style="flex:0"><button id="showReport">报告</button><button id="showLog">日志</button><button id="cancel">取消任务</button></div>
      <div id="report" style="margin-top:10px"></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let current = null;

function fmt(t) { return t ? new Date(t).toLocaleString() : '-'; }

// Minimal markdown: headings, images, code fences, tables, bold, lists. Image paths are relative to reportDir.
function md(text, base) {
  const out = []; let code = false; let table = [];
  const flush = () => { if (table.length) { out.push('<table>' + table.map((r, i) => '<tr>' + r.map((c) => i ? `<td>${c}</td>` : `<th>${c}</th>`).join('') + '</tr>').join('') + '</table>'); table = []; } };
  const inline = (s) => esc(s)
    .replace(/!\[[^\]]*\]\(([^)]+)\)/g, (_, p) => `<a href="${base}${p}" target="_blank"><img src="${base}${p}"></a>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  for (const line of text.split('\n')) {
    if (line.startsWith('```')) { flush(); out.push(code ? '</pre>' : '<pre>'); code = !code; continue; }
    if (code) { out.push(esc(line)); continue; }
    if (/^\|/.test(line)) { if (!/^\|[-| ]+\|$/.test(line)) table.push(line.slice(1, -1).split('|').map((c) => inline(c.trim()))); continue; }
    flush();
    const h = line.match(/^(#{1,3}) (.*)/);
    if (h) out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`);
    else if (line.trim()) out.push(`<div>${inline(line)}</div>`);
  }
  flush();
  return out.join('\n');
}

async function loadDevices() {
  const r = await fetch('/api/devices').then((x) => x.json());
  $('devices').innerHTML = r.devices.map((d) => `<tr><td>${esc(d.name)}<div class="muted">${esc(d.udid)} · adb ${esc(d.adbState)}</div></td><td><span class="pill ${d.status}">${d.status}</span></td><td class="muted">${esc(d.taskId ?? '')}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">无设备</td></tr>';
  $('poolInfo').textContent = `maxConcurrent=${r.config.maxConcurrent} · strategy=${r.config.strategy}`;
  const sel = $('device'); const keep = sel.value;
  sel.innerHTML = '<option value="">自动分配</option>' + r.devices.map((d) => `<option value="${esc(d.udid)}">${esc(d.name)} (${d.status})</option>`).join('');
  sel.value = keep;
}

async function loadTasks() {
  const list = await fetch('/api/tasks').then((x) => x.json());
  $('tasks').innerHTML = list.map((t) => `<tr>
    <td><b>${esc(t.type)}</b> <span class="muted">${esc(t.package)}</span><div>${esc(t.request ?? (t.seed !== undefined ? 'seed ' + t.seed : ''))}</div><div class="muted">${esc(t.id)}</div></td>
    <td><span class="pill ${t.status}">${t.status}</span></td><td class="muted">${esc(t.assignedDevice ?? t.device ?? '')}</td>
    <td class="muted">${fmt(t.startedAt ?? t.createdAt)}<br>${t.finishedAt ? '→ ' + fmt(t.finishedAt) : ''}</td>
    <td>${esc(t.verdict ?? '')}</td><td><button data-open="${esc(t.id)}">查看</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">暂无任务</td></tr>';
  if (current) { const t = list.find((x) => x.id === current); if (t) $('detailTitle').textContent = `${t.type} · ${t.status} · ${t.id}`; }
}

async function open(id, what = 'report') {
  current = id; $('detail').classList.remove('hidden');
  const t = await fetch(`/api/tasks/${id}`).then((x) => x.json());
  $('detailTitle').textContent = `${t.type} · ${t.status} · ${t.id}`;
  if (what === 'log' || !t.reportFile) {
    const log = await fetch(`/api/tasks/${id}/log`).then((x) => x.text());
    $('report').innerHTML = `<pre>${esc(log.split('\n').filter((l) => !l.startsWith('dbug')).slice(-200).join('\n'))}</pre>`;
    return;
  }
  const text = await fetch(`/api/tasks/${id}/report`).then((x) => x.text());
  const base = t.type === 'mission' ? `/files/missions/${t.id}/` : '/files/';
  $('report').innerHTML = md(text, base);
}

document.addEventListener('click', (e) => {
  const ex = e.target.dataset?.ex; if (ex) $('request').value = ex;
  const id = e.target.dataset?.open; if (id) open(id);
});
$('showReport').onclick = () => current && open(current, 'report');
$('showLog').onclick = () => current && open(current, 'log');
$('cancel').onclick = async () => { if (current) { await fetch(`/api/tasks/${current}/cancel`, { method: 'POST' }); loadTasks(); } };
$('type').onchange = () => {
  const t = $('type').value;
  $('missionFields').classList.toggle('hidden', t !== 'mission');
  $('monkeyFields').classList.toggle('hidden', t !== 'monkey');
  $('exploreFields').classList.toggle('hidden', t !== 'explore');
};
$('run').onclick = async () => {
  $('formErr').textContent = '';
  const body = { type: $('type').value, package: $('package').value.trim(), device: $('device').value || undefined };
  for (const k of ['request', 'maxSteps', 'maxMinutes', 'seed', 'events', 'steps']) { const v = $(k).value.trim(); if (v) body[k] = k === 'request' ? v : Number(v); }
  const r = await fetch('/api/tasks', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { $('formErr').textContent = j.error; return; }
  await loadTasks(); open(j.id, 'log');
};

async function poll() {
  try { await Promise.all([loadDevices(), loadTasks()]); } catch {}
  setTimeout(poll, 3000);
}
poll();
</script>
</body>
</html>
